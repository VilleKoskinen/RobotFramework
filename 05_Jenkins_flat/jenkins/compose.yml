# Reconstructed controller-only setup. Hardware tools run on a Windows agent.
name: robotframework-ex05
services:
  jenkins:
    image: jenkins/jenkins:2.568.3-jdk21
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
volumes:
  jenkins_home:
