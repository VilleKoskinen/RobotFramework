# Course services; the Windows agent invokes the separate Pico build container.
name: robotframework-ex05
services:
  jenkins:
    image: jenkins/jenkins:2.568.3-jdk21
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
  gogs:
    build:
      context: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:10022:10022"
    volumes:
      - gogs_data:/data
      - gogs_backup:/backup
    restart: unless-stopped
volumes:
  jenkins_home:
  gogs_data:
  gogs_backup:
